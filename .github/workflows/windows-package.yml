name: Windows package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Verify dynamic taskbar layout
        shell: pwsh
        run: |
          dotnet run --project tests/TaskbarSpaceProbe --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'CodexUsageMonitor'
          $archivePath = Join-Path $env:RUNNER_TEMP 'CodexUsageMonitor-win-x64.zip'
          dotnet publish windows-app/UsageMonitor.Windows/UsageMonitor.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --output $publishDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows-app/UsageMonitor.Supervisor/UsageMonitor.Supervisor.csproj --configuration Release --runtime win-x64 --self-contained true --output $publishDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath scripts/Install.ps1, scripts/Install.cmd, docs/INSTALL.md -Destination $publishDirectory
          Compress-Archive -Path (Join-Path $publishDirectory '*') -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Upload app package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CodexUsageMonitor-win-x64
          path: ${{ runner.temp }}/CodexUsageMonitor-win-x64.zip
          if-no-files-found: error
          retention-days: 14
